# Records the British female narrator voice (Piper, open-source neural TTS) for everything the app says,
# and commits the clips to audio/. Runs when the app's text changes, or by hand (Actions tab -> Run workflow).
name: Voice clips

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/audio-texts.mjs'
      - 'scripts/gen_audio.py'

permissions:
  contents: write

# one at a time, so two pushes in a row can't both try to commit clips
concurrency:
  group: voice-clips
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest branch tip, so clips recorded by an earlier run are already there
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install piper-tts numpy
      - run: ffmpeg -version | head -1
      - run: node scripts/audio-texts.mjs
      - run: python scripts/gen_audio.py
        timeout-minutes: 70
        env:
          TTS_ENGINE: piper
          TTS_BUDGET_MIN: '55'   # keeps what it has when time is up; run again to finish the rest
      - name: Fail loudly if nothing was recorded
        if: always()
        run: |
          if [ ! -s audio/index.json ]; then
            echo "::error::No voice clips were recorded. The app will use the device voice."
            exit 1
          fi
          ls audio | wc -l
          du -sh audio
      - name: Commit new clips
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No new clips"
          else
            git commit -m "Update British voice clips"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
